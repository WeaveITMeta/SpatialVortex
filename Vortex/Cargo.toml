# =============================================================================
# Vortex — pure-Rust general intelligence system behind one host-agnostic
# API. Four crates; the numbered subsystems of SUBSYSTEMS.md are
# modules inside them, each keeping its "NNN | Vortex X" header:
#
#   crates/kernel   vortex-kernel   shared vocabulary (000)
#   crates/api      vortex-api      the whole in-process surface, pure: no
#                                   file, process, network or env I/O
#                                   (001-006, 008, 010 behind `world`, 012)
#   crates/harness  vortex-harness  graders; kernel only, never the api (014)
#   crates/lab      vortex-lab      everything with side effects, plus the
#                                   `vortex` CLI (001 lifecycle, 002 corpus,
#                                   006 host tools + MCP, 012 ledger, 015)
#
# Package names are `vortex-*` and deliberately never plain `vortex`, which is
# already taken by ../aimodel.
# =============================================================================

[workspace]
resolver = "3"
members = ["crates/*"]
# Cross-checks that need a different serde_json configuration; see its Cargo.toml.
exclude = ["conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["McKale Olson"]
repository = "https://github.com/WeaveITMeta/SpatialVortex"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.22"

vortex-kernel = { path = "crates/kernel" }
vortex-api = { path = "crates/api" }
vortex-harness = { path = "crates/harness" }
vortex-lab = { path = "crates/lab" }

# The domain-agnostic WorldState core (same repository, not the engine
# submodule). Optional: only the `world` feature of vortex-api needs it.
eustress-vortex-core = { path = "../eustress/crates/vortex-core" }
eustress-vortex-grid2d = { path = "../eustress/crates/vortex-grid2d" }

[profile.release]
opt-level = 3
debug = false
# One codegen unit plus thin LTO: slower to build, faster to run.
codegen-units = 1
lto = "thin"

# Tests that train the n-gram model are slow unoptimised.
[profile.test]
opt-level = 2
